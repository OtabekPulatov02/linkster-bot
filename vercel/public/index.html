<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Linkster</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000; --card:#0d0d14; --card2:#14141f; --line:rgba(255,255,255,.09);
  --text:#fff; --muted:#8c8ca3; --v1:#6b4bff; --v2:#b44bff; --ok:#3ddc97; --err:#ff6b81;
  --grad:linear-gradient(135deg,#6b4bff 0%,#b44bff 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));overflow-x:hidden}
.glow{position:fixed;left:50%;top:-120px;width:560px;height:560px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(107,75,255,.38),rgba(180,75,255,.14) 55%,transparent 75%);
  filter:blur(30px);pointer-events:none;z-index:0}
main{position:relative;width:100%;max-width:440px;flex:1;display:flex;flex-direction:column}
.hero{text-align:center;padding:6px 0 18px}
.hero img{width:min(58vw,230px);height:auto;display:block;margin:0 auto;mix-blend-mode:screen}
.hero p{color:var(--muted);font-size:14.5px;font-weight:500;margin-top:-30px;position:relative;letter-spacing:.1px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:24px;padding:16px;backdrop-filter:blur(14px)}
.field{display:flex;align-items:center;gap:10px;background:var(--card2);border:1.5px solid var(--line);
  border-radius:16px;padding:6px 6px 6px 14px;transition:.2s}
.field:focus-within{border-color:var(--v1);box-shadow:0 0 0 4px rgba(107,75,255,.18)}
.field.bad{border-color:var(--err);box-shadow:0 0 0 4px rgba(255,107,129,.14)}
.field svg.ic{flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15.5px;font-weight:500;padding:11px 0}
.field input::placeholder{color:#5d5d73}
.paste{flex:none;border:0;background:rgba(107,75,255,.16);color:#c9bdff;font:inherit;font-weight:700;font-size:13px;
  padding:10px 14px;border-radius:11px;cursor:pointer;transition:.15s}
.paste:active{transform:scale(.95)}
.chips{display:flex;gap:8px;margin:12px 2px 2px;color:var(--muted);font-size:12.5px;font-weight:600;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);transition:.2s}
.chip.on{color:#fff;border-color:transparent;background:var(--grad)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:16px 0 14px;padding:4px;
  background:var(--card2);border:1px solid var(--line);border-radius:16px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:12px;background:var(--grad);
  transition:transform .28s cubic-bezier(.3,.8,.3,1);box-shadow:0 6px 20px rgba(107,75,255,.4)}
.seg[data-v=mp3] i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:15px;
  padding:13px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:color .2s}
.seg button.on{color:#fff}
.go{width:100%;border:0;border-radius:16px;padding:17px;font:inherit;font-weight:800;font-size:16.5px;color:#fff;cursor:pointer;
  background:var(--grad);box-shadow:0 10px 30px rgba(107,75,255,.45);display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .12s,opacity .2s,box-shadow .2s}
.go:active{transform:scale(.98)}
.go[disabled]{opacity:.45;box-shadow:none;cursor:default}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{min-height:20px;margin:12px 4px 0;font-size:13.5px;font-weight:600;text-align:center;color:var(--muted)}
.msg.err{color:var(--err)}
.done{display:none;text-align:center;padding:14px 6px 6px}
.done .ring{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;background:rgba(61,220,151,.12);display:grid;place-items:center;
  animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.done h2{font-size:20px;font-weight:800;margin-bottom:6px}
.done p{color:var(--muted);font-size:14px;font-weight:500;line-height:1.5;margin-bottom:18px}
.ghost{border:1px solid var(--line);background:var(--card2);color:#fff;font:inherit;font-weight:700;font-size:14.5px;padding:14px 22px;border-radius:14px;cursor:pointer}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.state-done .form{display:none}.state-done .done{display:block}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.steps div{text-align:center;color:var(--muted);font-size:11.5px;font-weight:600;line-height:1.35;padding:12px 6px;border-radius:16px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.steps b{display:block;color:#fff;font-size:12.5px;margin-bottom:2px}
footer{margin-top:auto;padding-top:22px;text-align:center;color:#55556a;font-size:12.5px;font-weight:600}
footer a{color:#9a86ff;text-decoration:none}
.nt{display:none;text-align:center;padding:10px 4px 4px}
.nt p{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.5}
.nt a{display:inline-block;text-decoration:none}
.outside .form{display:none}.outside .nt{display:block}
</style>
</head>
<body>
<div class="glow"></div>
<main id="app">
  <div class="hero">
    <img src="/logo.png" alt="Linkster" width="230" height="230">
    <p id="tag"></p>
  </div>

  <section class="card">
    <div class="form">
      <div class="field" id="field">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.3 4.6"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
        <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="paste" id="paste" type="button"></button>
      </div>
      <div class="chips">
        <span class="chip" id="c-yt"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12s0 2.9.5 4.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.8.5-4.8s0-2.9-.5-4.8zM9.8 15.1V8.9l5.4 3.1z"/></svg>YouTube</span>
        <span class="chip" id="c-ig"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Instagram</span>
      </div>

      <div class="seg" id="seg" data-v="mp4">
        <i></i>
        <button type="button" data-v="mp4" class="on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z" fill="currentColor"/></svg><span>MP4</span></button>
        <button type="button" data-v="mp3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span>MP3</span></button>
      </div>

      <button class="go" id="go" type="button" disabled></button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="done">
      <div class="ring"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 id="d-h"></h2><p id="d-p"></p>
      <button class="ghost" id="again" type="button"></button>
    </div>

    <div class="nt">
      <p id="nt-p"></p>
      <a href="https://t.me/linkster_bot"><button class="go" type="button" id="nt-b" style="width:auto;padding:15px 26px"></button></a>
    </div>
  </section>

  <div class="steps" id="steps"></div>
  <footer>@<a href="https://t.me/linkster_bot">linkster_bot</a></footer>
</main>

<script>
(()=>{
const tg = window.Telegram && Telegram.WebApp;
const initData = tg ? tg.initData : '';
const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const lang = ((user && user.language_code) || navigator.language || 'ru').toLowerCase().startsWith('uz') ? 'uz' : 'ru';
const S = {
 ru:{tag:'YouTube и Instagram → MP4 или MP3',ph:'Вставь ссылку на видео',paste:'Вставить',go:'Скачать',
     wait:'Отправляю…',okh:'Готово! Файл идёт в чат',okp:'Бот пришлёт файл в течение минуты. Можно закрыть окно и вернуться в чат.',
     again:'Ещё одну ссылку',bad:'Нужна ссылка YouTube или Instagram',auth:'Открой приложение через бота',nochat:'Сначала нажми /start в боте',
     fail:'Не получилось. Попробуй ещё раз',nt:'Это приложение работает внутри Telegram.',ntb:'Открыть в Telegram',
     s:[['1. Ссылка','вставь из буфера'],['2. Формат','видео или звук'],['3. Чат','файл придёт в бот']]},
 uz:{tag:'YouTube va Instagram → MP4 yoki MP3',ph:'Video havolasini qo‘ying',paste:'Qo‘yish',go:'Yuklab olish',
     wait:'Yuborilmoqda…',okh:'Tayyor! Fayl chatga yo‘lda',okp:'Bot faylni bir daqiqa ichida yuboradi. Oynani yopib, chatga qaytishingiz mumkin.',
     again:'Yana bir havola',bad:'YouTube yoki Instagram havolasi kerak',auth:'Ilovani bot orqali oching',nochat:'Avval botda /start bosing',
     fail:'Bo‘lmadi. Qayta urinib ko‘ring',nt:'Bu ilova Telegram ichida ishlaydi.',ntb:'Telegramda ochish',
     s:[['1. Havola','buferdan qo‘ying'],['2. Format','video yoki ovoz'],['3. Chat','fayl botga keladi']]}
}[lang];
document.documentElement.lang = lang;
const $ = id => document.getElementById(id);
$('tag').textContent=S.tag; $('url').placeholder=S.ph; $('paste').textContent=S.paste; $('go').textContent=S.go;
$('again').textContent=S.again; $('d-h').textContent=S.okh; $('d-p').textContent=S.okp; $('nt-p').textContent=S.nt; $('nt-b').textContent=S.ntb;
$('steps').innerHTML = S.s.map(x=>`<div><b>${x[0]}</b>${x[1]}</div>`).join('');

if (tg){ try{ tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); }catch(e){} }
if (!initData) document.getElementById('app').classList.add('outside');
const hap = t => { try{ tg.HapticFeedback.notificationOccurred(t); }catch(e){} };
const tap = () => { try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){} };

const HOSTS = {'youtube.com':'yt','m.youtube.com':'yt','music.youtube.com':'yt','youtu.be':'yt','youtube-nocookie.com':'yt','instagram.com':'ig','instagr.am':'ig'};
function detect(v){
  const m = (v||'').match(/https?:\/\/[^\s<>"']+/i); if(!m) return null;
  try{ let h=new URL(m[0]).hostname.toLowerCase().replace(/^www\./,''); return HOSTS[h]?{kind:HOSTS[h],url:m[0]}:{kind:null}; }catch(e){return null}
}
let fmt='mp4', busy=false;
function refresh(){
  const d=detect($('url').value);
  $('c-yt').classList.toggle('on', d&&d.kind==='yt'); $('c-ig').classList.toggle('on', d&&d.kind==='ig');
  $('field').classList.toggle('bad', !!(d&&d.kind===null && $('url').value.length>8));
  $('go').disabled = busy || !(d&&d.kind);
  if(d&&d.kind) setMsg('');
}
function setMsg(t,err){ const m=$('msg'); m.textContent=t||''; m.className='msg'+(err?' err':''); }
$('url').addEventListener('input',refresh);
$('seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; fmt=b.dataset.v; tap();
  $('seg').dataset.v=fmt; [...$('seg').querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b)); });
$('paste').addEventListener('click',async()=>{
  tap(); let t='';
  try{ t=await navigator.clipboard.readText(); }catch(e){}
  if(!t && tg && tg.readTextFromClipboard){ await new Promise(r=>tg.readTextFromClipboard(x=>{t=x||'';r();})); }
  if(t){ $('url').value=t.trim(); refresh(); } else { $('url').focus(); }
});
$('again').addEventListener('click',()=>{ $('app').classList.remove('state-done'); $('url').value=''; refresh(); $('url').focus(); });
$('go').addEventListener('click',async()=>{
  const d=detect($('url').value); if(!(d&&d.kind)||busy) return;
  busy=true; $('go').disabled=true; $('go').innerHTML='<span class="spin"></span>'+S.wait; setMsg('');
  try{
    const r=await fetch('/api/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,action:'download',url:d.url,fmt})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){ hap('success'); $('app').classList.add('state-done'); }
    else { hap('error'); setMsg(r.status===401?S.auth:r.status===409?S.nochat:r.status===400?S.bad:S.fail,true); }
  }catch(e){ hap('error'); setMsg(S.fail,true); }
  busy=false; $('go').textContent=S.go; refresh();
});
if (initData) fetch('/api/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,action:'open'})}).catch(()=>{});
refresh();
})();
</script>
</body>
</html>
